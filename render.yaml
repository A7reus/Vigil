# Render blueprint: New → Blueprint → connect repo, or paste this in manual setup.
# Python version comes from `.python-version` (Render default is 3.14.x).
services:
  - type: web
    name: vigil
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m data_gen.generate --n-customers 2000 --n-txns 20000 --out data && python -m models.train --data data --artifacts artifacts
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: VIGIL_ALERTS_LIMIT
        value: 100
      - key: VIGIL_RATE_LIMIT_PER_MIN
        value: 120
      - key: OLLAMA_MODEL
        value: qwen2.5:3b
      # No daemon on Render free tier: the API serves template narratives.
      # On your own box, `ollama pull qwen2.5:3b` + `ollama serve` instead.
# Durable decisions on hosted Render (free disks are wiped on sleep/redeploy):
# Dashboard → New → PostgreSQL (free, 30-day expiry covers judging; $6/mo
# after) → Connect → Environment → DATABASE_URL. With it set, the API logs
# decisions to Postgres; without it, SQLite, same contract. Venue laptop
# needs none of this — SQLite is the offline default.
#databases:
