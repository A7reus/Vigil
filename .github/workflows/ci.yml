# Continuous proof: install, generate small data, train, full test suite.
# Live LLM tests stay skipped (they need VIGIL_LIVE_LLM_TEST=1 + local ollama).
name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vigil
          POSTGRES_PASSWORD: vigil
          POSTGRES_DB: vigil
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vigil"
          --health-interval 5s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://vigil:vigil@localhost:5432/vigil
      TEST_POSTGRES_URL: postgresql://vigil:vigil@localhost:5432/vigil
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m data_gen.generate --n-customers 800 --n-txns 8000 --out data
      - run: python -m models.train --data data --artifacts artifacts
      - run: python -m pytest -q
