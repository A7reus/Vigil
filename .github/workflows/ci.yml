# Continuous proof: install, generate small data, train, full test suite.
# Live LLM tests stay skipped (they need LLM_API_KEY + VIGIL_LIVE_LLM_TEST=1).
name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m data_gen.generate --n-customers 800 --n-txns 8000 --out data
      - run: python -m models.train --data data --artifacts artifacts
      - run: python -m pytest -q
